<html lang="en">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="Simple, safe voting information for everyone.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗳️</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="logo">Vote <span>Saathi</span></div>
    <nav>
      <a href="index.html">Home</a>
      <a href="learn.html">Learn</a>
      <a href="scam.html">Safety</a>
      <a href="quiz.html">Quiz</a>
      <a href="volunteer.html">Volunteer</a>
      <a href="impact.html">Impact</a>
    </nav>
    <a href="index.html" class="easy-btn" style="text-decoration:none">← Back to Home</a>
  </header>
<section class="page-hero">
  <div>
    <h1>Voting Knowledge <span>Quiz</span></h1>
    <p>Test what you know about voting. 5 random questions each time.</p>
  </div>
  <div class="art">🧠</div>
</section>
  <section class="quiz" id="quiz">
    <div id="quizBox">
      <p id="quizCount"></p>
      <h3 id="quizQuestion"></h3>
      <div id="quizOptions"></div>
      <p id="quizFeedback"></p>
      <button id="nextBtn" class="btn btn-blue" hidden>Next →</button>
    </div>

    <div id="quizResult" hidden>
      <h3 id="quizScore"></h3>
      <p id="quizMessage"></p>
      <button id="restartBtn" class="btn btn-green">Play Again</button>
    </div>
  </section>

  <footer>
    <div class="footer-logo">Vote <span>Saathi</span></div>
    <div class="footer-links">
      <a href="index.html">Home</a>
      <a href="privacy.html">Privacy Policy</a>
      <a href="contact.html">Contact</a>
    </div>
  </footer>

  <script>
   // ===== QUIZ =====
// Each question has: text, a list of options, and the position of the right answer (starts at 0)
const questions = [
  { q: "What is the minimum age to vote in India?",
    options: ["16", "18", "21", "25"], answer: 1 },
  { q: "Which body conducts elections in India?",
    options: ["Supreme Court", "Parliament", "Election Commission of India", "Reserve Bank"], answer: 2 },
  { q: "What does NOTA mean on a voting machine?",
    options: ["None Of The Above", "Not On The Agenda", "National Option To Abstain", "New Option To Appeal"], answer: 0 },
  { q: "Which finger is marked with indelible ink after you vote?",
    options: ["Right thumb", "Right index finger", "Left index finger", "Left thumb"], answer: 2 },
  { q: "What is the national Voter Helpline number?",
    options: ["100", "1950", "1800", "112"], answer: 1 },
  { q: "Which form do you fill to register as a new voter?",
    options: ["Form 6", "Form 1", "Form 16", "Form 20"], answer: 0 },
  { q: "How often are Lok Sabha elections normally held?",
    options: ["Every 2 years", "Every 3 years", "Every 5 years", "Every 10 years"], answer: 2 },
  { q: "On which date is National Voters' Day celebrated?",
    options: ["26 January", "25 January", "15 August", "2 October"], answer: 1 },
  { q: "Who are you required to tell about who you voted for?",
    options: ["Your family", "The polling officer", "A party worker", "Nobody. Your vote is secret"], answer: 3 },
  { q: "You get a message saying 'Vote online, click this link!' What should you do?",
    options: ["Click it quickly", "Forward it to friends", "Don't click. Check the official Election Commission website", "Reply with your Voter ID number"], answer: 2 }
];

let quizQuestions = [];  // the 5 questions chosen for this round
let current = 0;         // which question we are on
let score = 0;
let answered = false;    // stops people clicking twice

// Mix the list randomly
function shuffle(list) {
  return [...list].sort(() => Math.random() - 0.5);
}

function startQuiz() {
  quizQuestions = shuffle(questions).slice(0, 5);  // take the first 5
  current = 0;
  score = 0;
  document.getElementById("quizBox").hidden = false;
  document.getElementById("quizResult").hidden = true;
  showQuestion();
}

function showQuestion() {
  answered = false;
  const item = quizQuestions[current];

  document.getElementById("quizCount").textContent =
    "Question " + (current + 1) + " of " + quizQuestions.length;
  document.getElementById("quizQuestion").textContent = item.q;
  document.getElementById("quizFeedback").textContent = "";
  document.getElementById("nextBtn").hidden = true;

  const box = document.getElementById("quizOptions");
  box.innerHTML = "";  // clear old buttons

  // Make one button for each option
  item.options.forEach(function (text, index) {
    const btn = document.createElement("button");
    btn.className = "option";
    btn.textContent = text;
    btn.addEventListener("click", function () { checkAnswer(index); });
    box.appendChild(btn);
  });
}

function checkAnswer(index) {
  if (answered) return;
  answered = true;

  const item = quizQuestions[current];
  const buttons = document.querySelectorAll(".option");
  const feedback = document.getElementById("quizFeedback");

  if (index === item.answer) {
    score++;
    buttons[index].classList.add("correct");
    feedback.textContent = "✅ Correct!";
  } else {
    buttons[index].classList.add("wrong");
    buttons[item.answer].classList.add("correct");
    feedback.textContent = "❌ Not quite. The right answer is highlighted.";
  }

  const next = document.getElementById("nextBtn");
  next.textContent = current === quizQuestions.length - 1 ? "See Result" : "Next →";
  next.hidden = false;
}

function nextQuestion() {
  current++;
  if (current < quizQuestions.length) {
    showQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  document.getElementById("quizBox").hidden = true;
  document.getElementById("quizResult").hidden = false;
  document.getElementById("quizScore").textContent =
    "You scored " + score + " out of " + quizQuestions.length;

  let message = "Keep learning. Every informed voter makes a difference!";
  if (score === quizQuestions.length) message = "Perfect! You're a voting champion! 🏆";
  else if (score >= 3) message = "Great job! You know your voting basics. 👏";
  document.getElementById("quizMessage").textContent = message;
}

document.getElementById("nextBtn").addEventListener("click", nextQuestion);
document.getElementById("restartBtn").addEventListener("click", startQuiz);

startQuiz();  // start automatically when the page loads
  </script>
<script src="easy.js"></script>
</body>
</html>
